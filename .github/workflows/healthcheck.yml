name: CSFloat Secondary Health Check

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout repository code
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Prepare git-crypt
        timeout-minutes: 8
        run: bash .github/scripts/prepare_git_crypt.sh

      - name: Unlock git-crypt
        timeout-minutes: 3
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          umask 077
          trap 'rm -f git-crypt-key' EXIT
          printf '%s' "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Install health-check dependencies
        timeout-minutes: 7
        env:
          PIP_RETRIES: "5"
        run: python -m pip install --disable-pip-version-check --no-index --find-links .github/vendor/wheels -r requirements.txt

      - name: Validate decrypted runtime configuration
        timeout-minutes: 5
        run: |
          if ! python .github/scripts/validate_runtime_config.py > /tmp/healthcheck_validation.txt 2>&1; then
            echo "::error title=Runtime configuration invalid::Detailed decrypted diagnostics were withheld from Actions output."
            exit 1
          fi

      - name: Verify runtime checkpoint permission
        timeout-minutes: 5
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "health-check permission probe"
          push_auth="$(printf 'x:%s' "$GH_PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$push_auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $push_auth"
          timeout --signal=TERM --kill-after=5s 90s git fetch --quiet origin master
          # Live runs push state every few minutes, so the probe commit is
          # often behind master. A non-fast-forward rejection still proves the
          # token authenticated for push; only auth or transport errors fail.
          set +e
          probe_output="$(timeout --signal=TERM --kill-after=5s 90s git push --dry-run --porcelain origin HEAD:master 2>&1)"
          probe_status=$?
          set -e
          printf '%s\n' "$probe_output"
          if [ "$probe_status" -eq 0 ]; then
            echo "Push permission verified."
          elif printf '%s' "$probe_output" | grep -qE '^!.*\[rejected\] \((non-fast-forward|fetch first)\)'; then
            echo "Push permission verified (dry-run rejected only as non-fast-forward)."
          else
            exit "$probe_status"
          fi

      - name: Verify CSFloat API and Discord
        timeout-minutes: 5
        env:
          CSFLOAT_API_KEY: ${{ secrets.CSFLOAT_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_LOG_WEBHOOK_URL }}
        run: |
          python <<'PY'
          import math
          import os

          import requests


          def safe_request(label, method, url, **kwargs):
              try:
                  response = requests.request(
                      method,
                      url,
                      timeout=20,
                      allow_redirects=False,
                      **kwargs,
                  )
              except requests.RequestException as exc:
                  raise SystemExit(
                      f"{label} transport failed ({type(exc).__name__})"
                  ) from None
              if response.status_code < 200 or response.status_code >= 300:
                  raise SystemExit(f"{label} returned HTTP {response.status_code}")
              return response


          def find_balance(value):
              if isinstance(value, dict):
                  for key, nested in value.items():
                      if str(key).lower() == "balance":
                          if isinstance(nested, bool):
                              continue
                          try:
                              balance = float(nested)
                          except (TypeError, ValueError, OverflowError):
                              continue
                          if math.isfinite(balance) and balance >= 0:
                              return balance
                  for nested in value.values():
                      found = find_balance(nested)
                      if found is not None:
                          return found
              return None


          api_key = os.environ.get("CSFLOAT_API_KEY", "").strip()
          webhooks = {
              value.strip()
              for value in (
                  os.environ.get("DISCORD_WEBHOOK_URL", ""),
                  os.environ.get("DISCORD_LOG_WEBHOOK_URL", ""),
              )
              if value.strip()
          }
          if not api_key or not webhooks:
              raise SystemExit("Required health-check secrets are missing")

          headers = {"Authorization": api_key}
          profile = safe_request(
              "CSFloat profile",
              "GET",
              "https://csfloat.com/api/v1/me",
              headers=headers,
          )
          try:
              profile_data = profile.json()
          except ValueError:
              raise SystemExit("CSFloat profile returned malformed JSON") from None
          balance_cents = find_balance(profile_data)
          if balance_cents is None:
              raise SystemExit("CSFloat profile did not contain a valid balance")

          orders = safe_request(
              "CSFloat buy-order read",
              "GET",
              "https://csfloat.com/api/v1/me/buy-orders",
              headers=headers,
              params={"limit": 1},
          )
          try:
              order_payload = orders.json()
          except ValueError:
              raise SystemExit("CSFloat buy-order endpoint returned malformed JSON") from None
          if not isinstance(order_payload, dict) or not isinstance(
              order_payload.get("orders"), list
          ):
              raise SystemExit("CSFloat buy-order endpoint returned an unexpected shape")

          message = (
              "✅ Bot B read-only production health check passed: strict "
              "configuration validation, CSFloat authentication, and Discord delivery."
          )
          for webhook_url in webhooks:
              response = safe_request(
                  "Discord health check",
                  "POST",
                  webhook_url,
                  json={"content": message, "allowed_mentions": {"parse": []}},
              )
              if response.status_code not in (200, 204):
                  raise SystemExit(
                      f"Discord health check returned HTTP {response.status_code}"
                  )

          print("Read-only production health checks passed; account details were not logged")
          PY

      - name: Report health-check failure to Discord
        if: ${{ failure() }}
        timeout-minutes: 3
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_LOG_WEBHOOK_URL: ${{ secrets.DISCORD_LOG_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          webhook = (
              os.environ.get("DISCORD_LOG_WEBHOOK_URL", "").strip()
              or os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          )
          if not webhook:
              raise SystemExit("Health-check failure webhook is unavailable")
          payload = json.dumps({
              "content": (
                  "🛑 Bot B read-only production health check failed. "
                  f"Run: {os.environ.get('RUN_URL', 'unavailable')}"
              ),
              "allowed_mentions": {"parse": []},
          }).encode("utf-8")
          request = Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(request, timeout=20) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError("unexpected response")
          except Exception:
              raise SystemExit("Discord failure report could not be delivered") from None
          PY
